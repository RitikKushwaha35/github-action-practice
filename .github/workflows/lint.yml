name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install Linter
        run:  pip install ruff

      - name: Chcek the files for linting
        run: ruff check .
        
