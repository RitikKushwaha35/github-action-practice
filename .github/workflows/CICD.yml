name: CICD

on: 
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        run: echo "Cloning the Code"
  build:
    needs: [code]
    runs-on: ubuntu-latest
    steps:
      - name: Build using Docker
        run: echo "Building the Code"
  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Test the Code
        run:  echo "Testing the Code"
  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the Code
        run:  echo "Deploy the Code"
